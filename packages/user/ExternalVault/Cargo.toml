[package]
name = "external-vault-pkg"
description = "Non-custodial Taproot, EVM Safe, Solana Squads, Stripe Connect, and Zakat Tamlik splits"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[package.metadata.psibase]
package-name = "ExternalVault"
services = ["external-vault"]

[package.metadata.psibase.dependencies]
Events = "0.29.0"
HttpServer = "0.29.0"
Sites = "0.29.0"
StagedTx = "0.29.0"
Tokens = "0.29.0"
Transact = "0.29.0"

[lib]
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
psibase.workspace = true
external-vault = { path = "service", version = "0.29.0" }
psibase-user-workspace-hack.workspace = true
