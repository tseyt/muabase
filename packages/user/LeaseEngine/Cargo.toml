[package]
name = "lease-engine-pkg"
description = "P2P usufruct rentals, progressive equity buyouts, and zero-riba charity penalty routing"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[package.metadata.psibase]
package-name = "LeaseEngine"
services = ["lease-engine"]

[package.metadata.psibase.dependencies]
Events = "0.29.0"
HttpServer = "0.29.0"
MutualShield = "0.29.0"
Sites = "0.29.0"
Tokens = "0.29.0"
Transact = "0.29.0"

[lib]
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
psibase.workspace = true
lease-engine = { path = "service", version = "0.29.0" }
mutual-shield-pkg = { path = "../MutualShield", version = "0.29.0" }
psibase-user-workspace-hack.workspace = true
