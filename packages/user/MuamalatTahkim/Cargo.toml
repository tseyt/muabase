[package]
name = "muamalat-tahkim-pkg"
description = "Scholar-attested commercial Muamalat milestone escrow and native 2-of-3 Tahkim arbitration"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[package.metadata.psibase]
package-name = "MuamalatTahkim"
services = ["muamalat-tahkim"]

[package.metadata.psibase.dependencies]
AuthDyn = "0.29.0"
Credentials = "0.29.0"
Events = "0.29.0"
HttpServer = "0.29.0"
StagedTx = "0.29.0"
Tokens = "0.29.0"
Transact = "0.29.0"

[lib]
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
psibase.workspace = true
muamalat-tahkim = { path = "service", version = "0.29.0" }
psibase-user-workspace-hack.workspace = true
