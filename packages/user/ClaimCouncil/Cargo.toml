[package]
name = "claim-council-pkg"
description = "3-peer rapid damage triage and objective bounty consensus"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[package.metadata.psibase]
package-name = "ClaimCouncil"
services = ["claim-council"]

[package.metadata.psibase.dependencies]
Credentials = "0.29.0"
Events = "0.29.0"
HttpServer = "0.29.0"
MutualShield = "0.29.0"
Sites = "0.29.0"
Tokens = "0.29.0"
Transact = "0.29.0"

[lib]
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
psibase.workspace = true
claim-council = { path = "service", version = "0.29.0" }
mutual-shield-pkg = { path = "../MutualShield", version = "0.29.0" }
psibase-user-workspace-hack.workspace = true
