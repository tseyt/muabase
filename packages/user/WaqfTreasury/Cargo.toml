[package]
name = "waqf-treasury-pkg"
description = "Programmable Waqf & Masjid Treasury OS with immutable shurut locks and board-quorum disbursements"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[package.metadata.psibase]
package-name = "WaqfTreasury"
services = ["waqf-treasury"]

[package.metadata.psibase.dependencies]
AuthDelegate = "0.29.0"
AuthDyn = "0.29.0"
Events = "0.29.0"
HttpServer = "0.29.0"
StagedTx = "0.29.0"
Tokens = "0.29.0"
Transact = "0.29.0"

[lib]
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
psibase.workspace = true
waqf-treasury = { path = "service", version = "0.29.0" }
psibase-user-workspace-hack.workspace = true
